<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure - Admin Dashboard</title>
    <link rel="stylesheet" href="/src/client/css/main.css">
    <style>
        .admin-container {
            padding: 40px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--accent-blue);
            padding-bottom: 15px;
        }
        .admin-section {
            background: rgba(12, 18, 29, 0.8);
            border: 1px solid #1e293b;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .ghost-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .ghost-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 15px;
            border-radius: 4px;
            position: relative;
        }
        .ghost-card.tier-8 {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
        }
        .ghost-tier {
            position: absolute;
            top: 10px;
            right: 10px;
            font-family: 'Share Tech Mono', monospace;
            background: rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 0.8rem;
        }
        .ghost-tier.tier-8 {
            background: var(--accent-red);
            color: #fff;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }
        .res-list {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }
        .admin-btn-group {
            display: flex;
            gap: 10px;
        }
        .admin-tab-content {
            display: none;
        }
        .admin-tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        .admin-tab-btn {
            border-radius: 2px 2px 0 0 !important;
            border-bottom: none !important;
            opacity: 0.6;
        }
        .admin-tab-btn.active {
            opacity: 1;
            background: rgba(56, 189, 248, 0.1) !important;
            border: 1px solid var(--accent-blue) !important;
            border-bottom: 1px solid transparent !important;
            color: var(--accent-blue) !important;
        }
    </style>
</head>
<body class="admin-body">
    <div class="admin-container">
        <header class="admin-header">
            <h1>🛠️ ADMIN DASHBOARD</h1>
            <div class="admin-btn-group">
                <a href="/" class="btn btn-secondary">BACK TO GAME</a>
                <button id="logout-btn" class="btn btn-logout">LOGOUT</button>
            </div>
        </header>

        <div class="admin-tabs" style="display: flex; gap: 5px; margin-bottom: 20px;">
            <button class="btn btn-secondary admin-tab-btn active" data-tab="anomalies">ANOMALY CONTROL</button>
            <button class="btn btn-secondary admin-tab-btn" data-tab="players">PLAYER ASSET CONTROL</button>
            <button class="btn btn-secondary admin-tab-btn" data-tab="events">EVENT VIEWER</button>
        </div>

        <div id="tab-anomalies" class="admin-tab-content active">
            <section class="admin-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>👻 GHOST PLANET MANAGEMENT</h2>
                    <div class="admin-btn-group">
                        <button id="spawn-ghosts-btn" class="btn btn-primary">FORCE SPAWN CYCLE</button>
                        <button id="clear-ghosts-btn" class="btn btn-danger">WIPE ALL GHOSTS</button>
                        <button id="refresh-ghosts-btn" class="btn btn-secondary">REFRESH LIST</button>
                    </div>
                </div>
                <div id="ghost-stats" style="margin-top: 10px; font-family: 'Share Tech Mono', monospace;">
                    TOTAL ACTIVE GHOSTS: <span id="ghost-count">0</span>
                </div>
                <div id="ghost-list" class="ghost-grid">
                    <!-- Loaded via JS -->
                    <p>Loading anomalies...</p>
                </div>
            </section>
        </div>

        <div id="tab-players" class="admin-tab-content">
            <section class="admin-section">
                <h2>👤 PLAYER ASSET MANAGEMENT</h2>
                <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="player-search-input" class="modal-input" placeholder="Search by username or ID..." style="flex: 1; height: 32px; font-size: 0.85rem;">
                    <button id="search-player-btn" class="btn btn-primary btn-small" style="width: 120px; height: 32px; font-size: 0.7rem; padding: 0;">SEARCH</button>
                </div>
                <div id="player-management-results" style="margin-top: 25px;">
                    <!-- Loaded via JS -->
                </div>
            </section>
        </div>

        <div id="tab-events" class="admin-tab-content">
            <section class="admin-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>📡 GLOBAL EVENT LOG</h2>
                    <div class="admin-btn-group">
                        <button id="refresh-events-btn" class="btn btn-secondary">REFRESH LOG</button>
                    </div>
                </div>
                <div id="event-log-container" style="margin-top: 20px; max-height: 600px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 4px; font-family: 'Share Tech Mono', monospace; font-size: 0.85rem;">
                    <!-- Loaded via JS -->
                    <p>Scanning subspace transmissions...</p>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="/src/client/js/admin.js"></script>
</body>
</html>
