<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure - OGame-like Strategy Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/client/css/main.css">
</head>
<body>
    <div id="app">
        <!-- Game Screen -->
        <div id="game-screen" class="screen active">
            <!-- Header -->
            <header class="game-header">
                <div class="header-left">
                    <div class="header-title-info">
                        <h1>🚀 Space Adventure</h1>
                        <span id="header-planet-info" class="header-planet-info">
                            <span id="planet-select-header-container"></span> 
                            <span id="planet-coords-header"></span>
                        </span>
                    </div>
                </div>
                <div class="header-center">
                    <div class="resource-display">
                        <div class="resource">
                            <span class="resource-icon">⚙️</span>
                            <span id="metal-amount">0</span>
                            <small>(<span id="metal-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">💎</span>
                            <span id="crystal-amount">0</span>
                            <small>(<span id="crystal-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">🛢️</span>
                            <span id="deuterium-amount">0</span>
                            <small>(<span id="deuterium-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">⚡</span>
                            <span id="energy-amount">0</span>
                            <small>(<span id="energy-production">0</span>)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">💦</span>
                            <span id="water-amount">0</span>
                            <small>(<span id="water-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">🍞</span>
                            <span id="food-amount">0</span>
                            <small>(<span id="food-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">👥</span>
                            <span id="population-amount">0</span>
                            <small>/<span id="population-max">0</span> (<span id="population-production">0</span>/h)</small>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <div class="user-info-group">
                        <span id="player-name" class="player-name"></span>
                        <button id="logout-btn" class="btn btn-logout-header">Logout</button>
                    </div>
                </div>
            </header>
            
            <!-- Navigation -->
            <nav class="game-nav">
                <button class="nav-btn active" data-view="overview">Overview</button>
                <button class="nav-btn" data-view="buildings">Buildings</button>
                <button class="nav-btn" data-view="allocation">Allocation</button>
                <button class="nav-btn" data-view="research">Research</button>
                <button class="nav-btn" data-view="shipyard">Shipyard</button>
                <button class="nav-btn" data-view="defenses">Defenses</button>
                <button class="nav-btn" data-view="ranking">Ranking</button>
                <button class="nav-btn" data-view="fleet">Fleet</button>
                <button class="nav-btn" data-view="galaxy">Galaxy</button>
                <button class="nav-btn" data-view="messages">Messages</button>
            </nav>
            
            <!-- Global Fleet Movements -->
            <div id="fleet-movements-bar" class="fleet-movements-bar"></div>
            
            <!-- Content Area -->
            <main class="game-content">
                <!-- Overview View -->
                <div id="overview-view" class="view active">
                    <!-- Content will be dynamically loaded by overview.js -->
                </div>
                
                <!-- Buildings View -->
                <div id="buildings-view" class="view">
                    <h2>Buildings</h2>
                    <div id="buildings-queue-container">
                        <!-- Queue will be dynamically loaded -->
                    </div>
                    <div id="buildings-grid" class="buildings-grid">
                        <!-- Buildings will be dynamically loaded -->
                    </div>
                </div>
                
                <!-- Allocation View -->
                <div id="allocation-view" class="view">
                    <!-- Allocation management will be dynamically loaded -->
                </div>
                
                <!-- Research View -->
                <div id="research-view" class="view">
                    <h2>Research Lab</h2>
                    <p>Research system coming soon...</p>
                </div>
                
                <!-- Shipyard View -->
                <div id="shipyard-view" class="view">
                    <h2>Shipyard</h2>
                    <p>Shipyard coming soon...</p>
                </div>
                
                <!-- Defenses View -->
                <div id="defenses-view" class="view">
                    <h2>Defenses</h2>
                    <p>Defenses coming soon...</p>
                </div>

                <!-- Ranking View -->
                <div id="ranking-view" class="view">
                    <h2>Hall of Fame</h2>
                    <div id="ranking-container"></div>
                </div>
                
                <!-- Fleet View -->
                <div id="fleet-view" class="view">
                    <h2>Fleet</h2>
                    <p>Fleet management coming soon...</p>
                </div>
                
                <!-- Galaxy View -->
                <div id="galaxy-view" class="view">
                    <div class="galaxy-container">
                        <!-- Content loaded dynamically -->
                    </div>
                </div>
                
                <!-- Messages View -->
                <div id="messages-view" class="view">
                    <div class="messages-container">
                        <!-- Content loaded dynamically -->
                    </div>
                </div>
            </main>
        </div>
        
        <!-- Generic Details Modal -->
        <div id="details-modal" class="modal">
            <div class="modal-content">
                <span class="modal-close" onclick="window.closeDetailsModal()">&times;</span>
                <h2 id="details-modal-title"></h2>
                <div id="details-modal-body"></div>
            </div>
        </div>

        <!-- Input/Confirm Modal -->
        <div id="input-modal" class="modal">
            <div class="modal-content modal-small">
                <span class="modal-close" onclick="window.closeInputModal()">&times;</span>
                <h2 id="input-modal-title">Confirm Action</h2>
                <div id="input-modal-body"></div>
                <div id="input-modal-field-container" style="display: none; margin: 15px 0;">
                    <input type="text" id="input-modal-field" class="modal-input">
                </div>
                <div class="modal-footer">
                    <button id="input-modal-cancel" class="btn btn-secondary" onclick="window.closeInputModal()">Cancel</button>
                    <button id="input-modal-confirm" class="btn btn-primary">Confirm</button>
                </div>
            </div>
        </div>

        <!-- Notifications -->
        <div id="notifications-container" class="notifications-container"></div>
    </div>
    
    <script type="module" src="/src/client/js/main.js"></script>
</body>
</html>
