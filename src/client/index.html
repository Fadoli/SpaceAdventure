<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure - OGame-like Strategy Game</title>
    <link rel="stylesheet" href="/src/client/css/main.css">
</head>
<body>
    <div id="app">
        <!-- Game Screen -->
        <div id="game-screen" class="screen active">
            <!-- Header -->
            <header class="game-header">
                <div class="header-left">
                    <h1>🚀 Space Adventure</h1>
                    <div class="player-info-header">
                        <span id="player-name" class="player-name"></span>
                        <span id="header-planet-info" class="header-planet-info">
                            <span id="planet-name-header"></span> 
                            <span id="planet-coords-header"></span>
                        </span>
                    </div>
                </div>
                <div class="header-center">
                    <div class="resource-display">
                        <div class="resource">
                            <span class="resource-icon">⚙️</span>
                            <span id="metal-amount">0</span>
                            <small>(+<span id="metal-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">💎</span>
                            <span id="crystal-amount">0</span>
                            <small>(+<span id="crystal-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">🛢️</span>
                            <span id="deuterium-amount">0</span>
                            <small>(+<span id="deuterium-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">⚡</span>
                            <span id="energy-amount">0</span>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">💦</span>
                            <span id="water-amount">0</span>
                            <small>(+<span id="water-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">🍞</span>
                            <span id="food-amount">0</span>
                            <small>(+<span id="food-production">0</span>/h)</small>
                        </div>
                        <div class="resource">
                            <span class="resource-icon">👥</span>
                            <span id="population-amount">0</span>
                            <small>/<span id="population-max">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <button id="logout-btn" class="btn btn-small">Logout</button>
                </div>
            </header>
            
            <!-- Navigation -->
            <nav class="game-nav">
                <button class="nav-btn active" data-view="overview">Overview</button>
                <button class="nav-btn" data-view="buildings">Buildings</button>
                <button class="nav-btn" data-view="allocation">Allocation</button>
                <button class="nav-btn" data-view="research">Research</button>
                <button class="nav-btn" data-view="shipyard">Shipyard</button>
                <button class="nav-btn" data-view="fleet">Fleet</button>
                <button class="nav-btn" data-view="galaxy">Galaxy</button>
            </nav>
            
            <!-- Global Fleet Movements -->
            <div id="fleet-movements-bar" class="fleet-movements-bar"></div>
            
            <!-- Content Area -->
            <main class="game-content">
                <!-- Overview View -->
                <div id="overview-view" class="view active">
                    <!-- Content will be dynamically loaded by overview.js -->
                </div>
                
                <!-- Buildings View -->
                <div id="buildings-view" class="view">
                    <h2>Buildings</h2>
                    <div id="buildings-queue-container">
                        <!-- Queue will be dynamically loaded -->
                    </div>
                    <div id="buildings-grid" class="buildings-grid">
                        <!-- Buildings will be dynamically loaded -->
                    </div>
                </div>
                
                <!-- Allocation View -->
                <div id="allocation-view" class="view">
                    <!-- Allocation management will be dynamically loaded -->
                </div>
                
                <!-- Research View -->
                <div id="research-view" class="view">
                    <h2>Research Lab</h2>
                    <p>Research system coming soon...</p>
                </div>
                
                <!-- Shipyard View -->
                <div id="shipyard-view" class="view">
                    <h2>Shipyard</h2>
                    <p>Shipyard coming soon...</p>
                </div>
                
                <!-- Fleet View -->
                <div id="fleet-view" class="view">
                    <h2>Fleet</h2>
                    <p>Fleet management coming soon...</p>
                </div>
                
                <!-- Galaxy View -->
                <div id="galaxy-view" class="view">
                    <div class="galaxy-container">
                        <!-- Content loaded dynamically -->
                    </div>
                </div>
            </main>
        </div>
        
        <!-- Generic Details Modal -->
        <div id="details-modal" class="modal">
            <div class="modal-content">
                <span class="modal-close" onclick="window.closeDetailsModal()">&times;</span>
                <h2 id="details-modal-title"></h2>
                <div id="details-modal-body"></div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/client/js/main.js"></script>
</body>
</html>
